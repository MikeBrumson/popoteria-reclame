<!doctype html>
<html lang="ro"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Popoteria — reclame TV</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #F3EBDD; cursor: none; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0; transition: opacity 1.2s ease; }
  iframe.vizibil { opacity: 1; z-index: 2; }
</style>
</head><body>
<iframe id="f0" title=""></iframe><iframe id="f1" title=""></iframe>
<script>
  // Rotește posterele: fiecare rulează o buclă întreagă (12 s), apoi următorul.
  // Următorul se încarcă ascuns cu 2 s înainte, ca trecerea să fie fără ecran gol.
  const POSTERE = ["268-ciuperci-la-gratar.html", "111-bulgareasca.html"];
  const DURATA = 20000, PRELOAD = 2000;
  const f = [document.getElementById("f0"), document.getElementById("f1")];
  let i = 0, activ = 0;
  f[0].src = POSTERE[0] + "?asteapta=1"; f[0].onload = () => f[0].contentWindow.postMessage("porneste", "*"); f[0].classList.add("vizibil");
  function urmatorul() {
    const nou = 1 - activ; i = (i + 1) % POSTERE.length;
    f[nou].onload = null; f[nou].src = POSTERE[i] + "?asteapta=1&r=" + Date.now();
    setTimeout(() => { f[nou].contentWindow.postMessage("porneste", "*"); f[nou].classList.add("vizibil"); const vechi = activ; f[vechi].classList.remove("vizibil"); setTimeout(() => { if (!f[vechi].classList.contains("vizibil")) f[vechi].src = "about:blank"; }, 1500); activ = nou; }, PRELOAD);
  }
  setTimeout(function pas() { urmatorul(); setTimeout(pas, DURATA); }, DURATA - PRELOAD);
</script>
</body></html>
